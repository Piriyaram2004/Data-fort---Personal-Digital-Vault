<div [routerLink]="['/vault/documents', document.id]" class="group bg-white p-4 rounded-xl border border-slate-200 shadow-xs hover:shadow-md transition cursor-pointer flex flex-col justify-between h-44">
  <div class="flex items-start justify-between">
    <div class="w-10 h-10 bg-blue-50 rounded-lg flex items-center justify-center text-blue-600 group-hover:scale-105 transition">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
    </div>
    <div class="flex space-x-1 opacity-0 group-hover:opacity-100 transition">
      <button (click)="onDownload($event)" class="p-1 text-slate-400 hover:text-blue-600 rounded" title="Download">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
      </button>
      <button (click)="onDelete($event)" class="p-1 text-slate-400 hover:text-red-600 rounded" title="Delete">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
      </button>
    </div>
  </div>

  <div>
    <h3 class="font-semibold text-slate-900 text-sm truncate group-hover:text-blue-600 transition">{{ document.fileName }}</h3>
    <p class="text-xs text-slate-500 mt-0.5">{{ document.fileSizeBytes | fileSize }}</p>
  </div>

  <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
    <app-integrity-badge [isVerified]="document.integrityVerified" />
    <span class="text-[10px] text-slate-400 font-mono truncate max-w-[80px]">{{ document.sha256Hash || 'hash-ok' }}</span>
  </div>
</div>

<div
  class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs hover:shadow-md transition flex flex-col justify-between h-44"
>
  <div class="flex items-start justify-between">
    <div
      class="w-10 h-10 bg-emerald-50 rounded-lg flex items-center justify-center text-emerald-600"
    >
      <svg
        class="w-6 h-6"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 0121 9z"
        />
      </svg>
    </div>

    <div class="flex space-x-1">
      <button
        type="button"
        (click)="onEdit()"
        class="p-1 text-slate-400 hover:text-blue-600 rounded"
        title="Edit"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
          />
        </svg>
      </button>

      <button
        type="button"
        (click)="onDelete()"
        class="p-1 text-slate-400 hover:text-red-600 rounded"
        title="Delete"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
          />
        </svg>
      </button>
    </div>
  </div>

  <div>
    <h3 class="font-semibold text-slate-900 text-sm truncate">
      {{ credential.title }}
    </h3>

    <div class="flex items-center space-x-2 mt-1">
      <span class="text-xs text-slate-600 font-mono truncate">
        {{ credential.userName }}
      </span>

      <button
        type="button"
        (click)="copyUsername()"
        class="text-[10px] text-blue-600 hover:underline"
      >
        {{ copied ? 'Copied!' : 'Copy' }}
      </button>
    </div>
  </div>

  <div
    class="pt-2 border-t border-slate-100 flex items-center justify-between"
  >
    <span class="text-xs font-mono text-slate-500 truncate max-w-[180px]">
      {{ showSecret ? credential.password : '••••••••' }}
    </span>

    <button
      type="button"
      (click)="toggleSecret()"
      class="text-xs text-slate-500 hover:text-slate-800 font-medium"
    >
      {{ showSecret ? 'Hide' : 'Reveal' }}
    </button>
  </div>
</div>

<div [routerLink]="['/vault/documents']" [queryParams]="{ folderId: folder.id }" class="group bg-white p-4 rounded-xl border border-slate-200 shadow-xs hover:shadow-md transition cursor-pointer flex flex-col justify-between h-36">
  <div class="flex items-start justify-between">
    <div class="w-10 h-10 bg-amber-50 rounded-lg flex items-center justify-center text-amber-600 group-hover:scale-105 transition">
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" /></svg>
    </div>
    <div class="flex space-x-1 opacity-0 group-hover:opacity-100 transition">
      <button (click)="onEdit($event)" class="p-1 text-slate-400 hover:text-blue-600 rounded" title="Edit">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
      </button>
      <button (click)="onDelete($event)" class="p-1 text-slate-400 hover:text-red-600 rounded" title="Delete">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
      </button>
    </div>
  </div>

  <div>
    <h3 class="font-semibold text-slate-900 text-sm truncate group-hover:text-blue-600 transition">{{ folder.name }}</h3>
    <p class="text-xs text-slate-500 truncate mt-0.5">{{ folder.description || 'No description' }}</p>
    <span class="text-[10px] font-medium text-slate-400 mt-2 block">{{ folder.documentCount || 0 }} files</span>
  </div>
</div>

<div class="space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between gap-4">

    <div>
      <h1 class="text-2xl font-bold text-slate-900">
        Vault Folders
      </h1>

      <p class="text-xs text-slate-500 mt-1">
        Organize your files into secure folders
      </p>
    </div>

    <a
      routerLink="/vault/folders/new"
      class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg transition"
    >
      + New Folder
    </a>

  </div>


  <!-- Loading -->
  @if (isLoading) {

    <app-loading message="Loading folders..." />

  }

  <!-- Error -->
  @else if (errorMessage) {

    <div class="rounded-lg border border-red-200 bg-red-50 p-4">

      <p class="text-sm text-red-700">
        {{ errorMessage }}
      </p>

      <button
        type="button"
        (click)="loadFolders()"
        class="mt-3 px-4 py-2 rounded-lg bg-red-600 text-white text-xs font-semibold hover:bg-red-700"
      >
        Try Again
      </button>

    </div>

  }

  <!-- Empty -->
  @else if (folders.length === 0) {

    <app-empty-state
      title="No Folders Found"
      message="Create your first folder to organize your vault items."
    />

  }

  <!-- Folder List -->
  @else {

    <div
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"
    >

      @for (folder of folders; track folder.folderId) {

        <app-folder-card
          [folder]="folder"
          (edit)="onEditFolder($event)"
          (delete)="onPromptDeleteFolder($event)"
        />

      }

    </div>

  }


  <!-- Delete Confirmation -->
  <app-confirm-dialog
    [isOpen]="showDeleteDialog"
    title="Delete Folder"
    message="Are you sure you want to delete this folder? Documents inside will not be deleted automatically."
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()"
  />

</div>

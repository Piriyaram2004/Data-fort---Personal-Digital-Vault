<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">Vault Folders</h1>
      <p class="text-xs text-slate-500 mt-1">Organize your files into secure folders</p>
    </div>
    <a routerLink="/vault/folders/new" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg transition">
      + New Folder
    </a>
  </div>

  @if (isLoading) {
    <app-loading message="Loading folders..." />
  } @else if (folders.length === 0) {
    <app-empty-state title="No Folders Found" message="Create your first folder to organize your vault items." />
  } @else {
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      @for (folder of folders; track folder.id) {
        <app-folder-card
          [folder]="folder"
          (edit)="onEditFolder($event)"
          (delete)="onPromptDeleteFolder($event)"
        />
      }
    </div>
  }

  <app-confirm-dialog
    [isOpen]="showDeleteDialog"
    title="Delete Folder"
    message="Are you sure you want to delete this folder? Documents inside will not be deleted automatically."
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()"
  />
</div>

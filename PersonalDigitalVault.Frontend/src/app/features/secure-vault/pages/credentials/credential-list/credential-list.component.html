<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">Stored Credentials</h1>
      <p class="text-xs text-slate-500 mt-1">Manage saved logins and secrets securely</p>
    </div>
    <a routerLink="/vault/credentials/new" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg transition">
      + Add Credential
    </a>
  </div>

  @if (isLoading) {
    <app-loading message="Loading credentials..." />
  } @else if (credentials.length === 0) {
    <app-empty-state title="No Credentials Stored" message="Add your first service credential to keep it safely in your digital vault." />
  } @else {
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      @for (cred of credentials; track cred.id) {
        <app-credential-card
          [credential]="cred"
          (edit)="onEditCredential($event)"
          (delete)="onPromptDeleteCredential($event)"
        />
      }
    </div>
  }

  <app-confirm-dialog
    [isOpen]="showDeleteDialog"
    title="Delete Credential"
    message="Are you sure you want to delete this credential item from your vault?"
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()"
  />
</div>

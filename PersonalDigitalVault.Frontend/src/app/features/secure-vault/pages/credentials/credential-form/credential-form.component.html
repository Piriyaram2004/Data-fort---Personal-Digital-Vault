<div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow border border-slate-200">
  <div class="flex items-center justify-between mb-6 pb-3 border-b border-slate-100">
    <h1 class="text-xl font-bold text-slate-800">{{ isEditMode ? 'Edit Credential' : 'Add Credential' }}</h1>
    <a routerLink="/vault/credentials" class="text-xs text-slate-500 hover:text-slate-800">Cancel</a>
  </div>

  @if (errorMessage) {
    <div class="mb-4 p-3 bg-red-100 text-red-800 text-xs rounded-lg border border-red-200">
      {{ errorMessage }}
    </div>
  }

  <form [formGroup]="credentialForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">Service / Website Name *</label>
      <input
        type="text"
        formControlName="serviceName"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"
        placeholder="e.g. GitHub, Google, Banking"
      />
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">Username / Email *</label>
      <input
        type="text"
        formControlName="username"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"
        placeholder="user@domain.com or john_doe"
      />
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">Password / Secret Key *</label>
      <input
        type="password"
        formControlName="secretValue"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 font-mono"
        placeholder="••••••••"
      />
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">Notes (Optional)</label>
      <textarea
        formControlName="notes"
        rows="3"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"
        placeholder="Optional notes or security pin info"
      ></textarea>
    </div>

    <div class="pt-2">
      <button
        type="submit"
        [disabled]="credentialForm.invalid || isLoading"
        class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-medium text-sm rounded-lg transition"
      >
        {{ isLoading ? 'Encrypting & Saving...' : (isEditMode ? 'Update Credential' : 'Save Credential') }}
      </button>
    </div>
  </form>
</div>

<div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow border border-slate-200">
  <div class="flex items-center justify-between mb-6 pb-3 border-b border-slate-100">
    <h1 class="text-xl font-bold text-slate-800">Upload Document</h1>
    <a routerLink="/vault/documents" class="text-xs text-slate-500 hover:text-slate-800">Cancel</a>
  </div>

  @if (errorMessage) {
    <div class="mb-4 p-3 bg-red-100 text-red-800 text-xs rounded-lg border border-red-200">
      {{ errorMessage }}
    </div>
  }

  <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">Select File *</label>
      <input
        type="file"
        (change)="onFileSelected($event)"
        class="w-full text-xs text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"
      />
      @if (selectedFile) {
        <p class="mt-1 text-[11px] text-slate-500 font-mono">{{ selectedFile.name }} ({{ selectedFile.size }} bytes)</p>
      }
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">Assign to Folder (Optional)</label>
      <select
        formControlName="folderId"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"
      >
        <option value="">-- No Folder (Root Vault) --</option>
        @for (folder of folders; track folder.id) {
          <option [value]="folder.id">{{ folder.name }}</option>
        }
      </select>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">Description</label>
      <textarea
        formControlName="description"
        rows="3"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"
        placeholder="Optional notes or description"
      ></textarea>
    </div>

    <div class="pt-2">
      <button
        type="submit"
        [disabled]="!selectedFile || isLoading"
        class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-medium text-sm rounded-lg transition"
      >
        {{ isLoading ? 'Uploading & Encrypting...' : 'Upload File' }}
      </button>
    </div>
  </form>
</div>

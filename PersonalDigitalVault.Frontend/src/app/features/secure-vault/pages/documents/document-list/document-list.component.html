<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">Vault Documents</h1>
      <p class="text-xs text-slate-500 mt-1">
        All stored encrypted documents
      </p>
    </div>

    <a
      routerLink="/vault/documents/upload"
      class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg transition"
    >
      + Upload Document
    </a>
  </div>

  @if (isLoading) {
    <app-loading message="Loading documents..." />
  }
  @else if (errorMessage) {
    <div class="p-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">
      {{ errorMessage }}
    </div>
  }
  @else if (documents.length === 0) {
    <app-empty-state
      title="No Documents Found"
      message="Upload your first file to store it safely in the vault."
    />
  }
  @else {
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      @for (doc of documents; track doc.documentId) {
        <app-document-card
          [document]="doc"
          (download)="onDownloadDocument($event)"
          (delete)="onPromptDeleteDocument($event)"
        />
      }
    </div>
  }

  <app-confirm-dialog
    [isOpen]="showDeleteDialog"
    title="Delete Document"
    message="Are you sure you want to permanently delete this document from your digital vault?"
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()"
  />
</div>

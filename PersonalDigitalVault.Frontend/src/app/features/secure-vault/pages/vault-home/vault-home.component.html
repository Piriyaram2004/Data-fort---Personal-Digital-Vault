<div class="space-y-6">

  <!-- Header -->
  <div>
    <h1 class="text-2xl font-bold text-slate-900">
      Secure Digital Vault
    </h1>

    <p class="mt-1 text-sm text-slate-500">
      Manage your folders, documents and credentials securely.
    </p>
  </div>

  <!-- Feature Cards -->
  <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4">

    <!-- Folders -->
    <button
      type="button"
      (click)="openFolders()"
      class="rounded-xl border border-slate-200 bg-white p-6 text-left shadow-sm transition hover:-translate-y-1 hover:shadow-md"
    >
      <div class="mb-4 text-4xl">📁</div>

      <h2 class="text-lg font-semibold text-slate-900">
        Folders
      </h2>

      <p class="mt-2 text-sm text-slate-500">
        Create and manage your vault folders.
      </p>

      <span class="mt-4 inline-block text-sm font-medium text-blue-600">
        Open Folders →
      </span>
    </button>

    <!-- Documents -->
    <button
      type="button"
      (click)="openDocuments()"
      class="rounded-xl border border-slate-200 bg-white p-6 text-left shadow-sm transition hover:-translate-y-1 hover:shadow-md"
    >
      <div class="mb-4 text-4xl">📄</div>

      <h2 class="text-lg font-semibold text-slate-900">
        Documents
      </h2>

      <p class="mt-2 text-sm text-slate-500">
        Upload, view, download and manage your documents.
      </p>

      <span class="mt-4 inline-block text-sm font-medium text-blue-600">
        Open Documents →
      </span>
    </button>

    <!-- Credentials -->
    <button
      type="button"
      (click)="openCredentials()"
      class="rounded-xl border border-slate-200 bg-white p-6 text-left shadow-sm transition hover:-translate-y-1 hover:shadow-md"
    >
      <div class="mb-4 text-4xl">🔐</div>

      <h2 class="text-lg font-semibold text-slate-900">
        Credentials
      </h2>

      <p class="mt-2 text-sm text-slate-500">
        Securely manage your saved credential records.
      </p>

      <span class="mt-4 inline-block text-sm font-medium text-blue-600">
        Open Credentials →
      </span>
    </button>

    <!-- Search -->
    <button
      type="button"
      (click)="openSearch()"
      class="rounded-xl border border-slate-200 bg-white p-6 text-left shadow-sm transition hover:-translate-y-1 hover:shadow-md"
    >
      <div class="mb-4 text-4xl">🔍</div>

      <h2 class="text-lg font-semibold text-slate-900">
        Search
      </h2>

      <p class="mt-2 text-sm text-slate-500">
        Search and filter your vault data.
      </p>

      <span class="mt-4 inline-block text-sm font-medium text-blue-600">
        Search Vault →
      </span>
    </button>

  </div>

  <!-- Security Information -->
  <div class="rounded-xl border border-blue-100 bg-blue-50 p-5">
    <h2 class="font-semibold text-slate-900">
      Your Secure Vault
    </h2>

    <p class="mt-1 text-sm text-slate-600">
      Your private vault data is protected by the application's
      authentication and backend security controls.
    </p>
  </div>

</div>

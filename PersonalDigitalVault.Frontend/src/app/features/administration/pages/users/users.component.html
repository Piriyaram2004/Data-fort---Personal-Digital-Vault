<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-bold text-slate-900">User Management</h1>
    <p class="text-xs text-slate-500 mt-1">Manage system user status and permissions</p>
  </div>

  @if (isLoading) {
    <app-loading message="Loading system users..." />
  } @else if (users.length === 0) {
    <app-empty-state title="No Users Found" message="There are no registered users in the database." />
  } @else {
    <app-user-table
      [users]="users"
      (toggleStatus)="onToggleUserStatus($event)"
      (deleteUser)="onPromptDeleteUser($event)"
    />
  }

  <app-confirm-dialog
    [isOpen]="showDeleteDialog"
    title="Delete User"
    message="Are you sure you want to delete this user account? This operation cannot be undone."
    (confirm)="confirmDelete()"
    (cancel)="showDeleteDialog = false"
  />
</div>

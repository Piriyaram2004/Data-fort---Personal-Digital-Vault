<div class="overflow-x-auto bg-white rounded-xl border border-slate-200 shadow-xs">
  <table class="w-full text-left text-xs border-collapse">
    <thead class="bg-slate-50 text-slate-500 uppercase tracking-wider font-semibold border-b border-slate-200">
      <tr>
        <th class="py-3 px-4">Username</th>
        <th class="py-3 px-4">Email</th>
        <th class="py-3 px-4">Role</th>
        <th class="py-3 px-4">Status</th>
        <th class="py-3 px-4">Joined</th>
        <th class="py-3 px-4 text-right">Actions</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-100 text-slate-700">
      @for (user of users; track user.id) {
        <tr class="hover:bg-slate-50/50 transition">
          <td class="py-3 px-4 font-semibold text-slate-900">{{ user.username }}</td>
          <td class="py-3 px-4">{{ user.email }}</td>
          <td class="py-3 px-4">
            <span class="px-2 py-0.5 rounded text-[10px] font-semibold capitalize" [class]="user.role.toLowerCase() === 'admin' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-700'">
              {{ user.role }}
            </span>
          </td>
          <td class="py-3 px-4">
            <span class="px-2 py-0.5 rounded text-[10px] font-semibold" [class]="user.isActive ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'">
              {{ user.isActive ? 'Active' : 'Disabled' }}
            </span>
          </td>
          <td class="py-3 px-4">{{ user.createdAt | date:'shortDate' }}</td>
          <td class="py-3 px-4 text-right space-x-2">
            <button (click)="onToggle(user)" class="text-xs font-semibold text-blue-600 hover:underline">
              {{ user.isActive ? 'Disable' : 'Enable' }}
            </button>
            <button (click)="onDelete(user.id)" class="text-xs font-semibold text-red-600 hover:underline">
              Delete
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

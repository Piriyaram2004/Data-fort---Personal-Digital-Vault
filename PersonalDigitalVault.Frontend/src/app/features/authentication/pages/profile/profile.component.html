<div class="max-w-2xl mx-auto space-y-6">
  <div class="bg-white p-6 rounded-xl shadow border border-slate-200">

    <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100">
      <div>
        <h1 class="text-xl font-bold text-slate-800">
          User Profile
        </h1>

        <p class="text-xs text-slate-500">
          Manage your Data Fort account details
        </p>
      </div>

      @if (!isUpdated) {
        <a
          routerLink="/auth/change-password"
          class="text-xs font-semibold text-blue-600 hover:underline"
        >
          Change Password
        </a>
      }
    </div>

    @if (errorMessage) {
      <div class="mb-4 p-3 bg-red-100 text-red-800 text-xs rounded-lg border border-red-200">
        {{ errorMessage }}
      </div>
    }

    @if (isLoading) {

      <div class="py-8 text-center text-slate-500 text-sm">
        Loading profile details...
      </div>

    } @else {

      @if (isUpdated) {

        <div class="py-8 text-center">

          <div class="mb-6 p-3 bg-emerald-100 text-emerald-800 text-xs rounded-lg border border-emerald-200">
            {{ successMessage }}
          </div>

          <button
            type="button"
            routerLink="/vault"
            class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg transition"
          >
            Back
          </button>

        </div>

      } @else {

        <form
          [formGroup]="profileForm"
          (ngSubmit)="onSaveProfile()"
          class="space-y-4"
        >

          <!-- Username -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">
              Username
            </label>

            <input
              type="text"
              formControlName="username"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"
            />
          </div>

          <!-- Full Name -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">
              Full Name
            </label>

            <input
              type="text"
              formControlName="fullName"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"
            />
          </div>

          <!-- Email -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">
              Email Address
            </label>

            <input
              type="email"
              formControlName="email"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"
            />
          </div>

          <!-- Account Role -->
          <div class="pt-2">
            <span class="block text-xs font-semibold text-slate-500">
              Account Role
            </span>

            <span class="text-sm font-medium text-slate-800 capitalize">
              {{ profile?.role || 'User' }}
            </span>
          </div>

          <!-- Save Button -->
          <div class="pt-4">
            <button
              type="submit"
              [disabled]="profileForm.invalid || isSaving"
              class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-medium text-sm rounded-lg transition"
            >
              {{ isSaving ? 'Saving...' : 'Save Profile Changes' }}
            </button>
          </div>

        </form>

      }

    }

  </div>
</div>

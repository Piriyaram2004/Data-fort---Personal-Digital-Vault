<main class="auth-page">
  <app-auth-scene />
  <section class="auth-card" aria-label="Login">
    <div class="auth-card-heading">
      <img class="card-logo" src="images/df-shield.svg" alt="Data Fort shield" />
      <h2>Welcome Back!</h2>
      <p>Login to your Personal Digital Vault</p>
    </div>
    @if (errorMessage) {
      <div class="form-alert error" role="alert">{{ errorMessage }}</div>
    }
    <form (ngSubmit)="loginForm.valid && onLogin()" #loginForm="ngForm" class="auth-form">
      <div class="field">
        <label for="login-email">Email Address</label>
        <div class="input-wrap">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 5h18v14H3z M3 6l9 7 9-7" /></svg
          ><input
            id="login-email"
            type="email"
            name="email"
            [(ngModel)]="email"
            required
            email
            autocomplete="username"
            placeholder="you@example.com"
          />
        </div>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <div class="input-wrap">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M7 10V7a5 5 0 0 1 10 0v3 M5 10h14v12H5z M12 15v3" /></svg
          ><input
            id="login-password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
            placeholder="••••••••"
          /><button
            class="reveal-button"
            type="button"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7 M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"
              />
            </svg>
          </button>
        </div>
      </div>
      <div class="form-options">
        <label class="remember-option" title="Remember your email on this device"
          ><input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe" />Remember Me</label
        ><a routerLink="/auth/forgot-password">Forgot Password?</a>
      </div>
      <button type="submit" class="primary-button" [disabled]="isLoading">
        <span>{{ isLoading ? 'Signing in...' : 'Login' }}</span
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 12h16 M14 6l6 6-6 6" />
        </svg>
      </button>
    </form>
    <div class="auth-divider"><span>OR</span></div>
    <button type="button" class="google-button" disabled aria-describedby="google-status">
      <span class="google-mark" aria-hidden="true">G</span>Continue with Google
    </button>
    <p id="google-status" class="provider-note">Google sign-in is not available yet.</p>
    <p class="auth-switch">
      Don’t have an account? <a routerLink="/auth/register">Create an account</a>
    </p>
  </section>
</main>

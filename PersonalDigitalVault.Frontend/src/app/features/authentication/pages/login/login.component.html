<div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl">

    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600 rounded-xl font-bold text-2xl text-white mb-3">
        DF
      </div>
      <h1 class="text-2xl font-bold text-white">Welcome Back</h1>
      <p class="text-slate-400 text-sm mt-1">
        Sign in to access your Personal Digital Vault
      </p>
    </div>

    @if (errorMessage) {
      <div class="mb-4 p-3 bg-red-900/50 border border-red-700 text-red-200 text-xs rounded-xl">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="space-y-5">

      <!-- Email -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">
          Email Address
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500 transition"
          placeholder="user@domain.com"
        />
      </div>

      <!-- Password -->
      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="block text-xs font-semibold text-slate-300">
            Password
          </label>

          <a
            routerLink="/auth/forgot-password"
            class="text-xs text-blue-400 hover:underline"
          >
            Forgot password?
          </a>
        </div>

        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            required
            class="w-full px-4 py-2.5 pr-12 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500 transition"
            placeholder="••••••••"
          />

          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-0 flex items-center px-4 text-slate-400 hover:text-white"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            @if (showPassword) {
              <span>🙈</span>
            } @else {
              <span>👁</span>
            }
          </button>
        </div>
      </div>

      <!-- Sign In -->
      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full py-3 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-medium text-sm rounded-xl transition shadow-lg shadow-blue-600/30"
      >
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>

    </form>

    <div class="mt-6 text-center text-xs text-slate-400">
      Don't have an account?
      <a
        routerLink="/auth/register"
        class="text-blue-400 font-semibold hover:underline"
      >
        Create an account
      </a>
    </div>

  </div>
</div>

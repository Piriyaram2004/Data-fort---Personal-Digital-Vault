<div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600 rounded-xl font-bold text-2xl text-white mb-3">DF</div>
      <h1 class="text-2xl font-bold text-white">Create Account</h1>
      <p class="text-slate-400 text-sm mt-1">Register for your personal encrypted vault</p>
    </div>

    @if (errorMessage) {
      <div class="mb-4 p-3 bg-red-900/50 border border-red-700 text-red-200 text-xs rounded-xl">
        {{ errorMessage }}
      </div>
    }

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Username</label>
        <input
          type="text"
          formControlName="username"
          class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500 transition"
          placeholder="johndoe"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500 transition"
          placeholder="user@domain.com"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
        <input
          type="password"
          formControlName="password"
          class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500 transition"
          placeholder="••••••••"
        />
      </div>

      <button
        type="submit"
        [disabled]="registerForm.invalid || isLoading"
        class="w-full py-3 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-medium text-sm rounded-xl transition shadow-lg shadow-blue-600/30"
      >
        {{ isLoading ? 'Creating Account...' : 'Register' }}
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-400">
      Already have an account?
      <a routerLink="/auth/login" class="text-blue-400 font-semibold hover:underline">Sign In</a>
    </div>
  </div>
</div>

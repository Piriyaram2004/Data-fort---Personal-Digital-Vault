<div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow border border-slate-200">
  <h2 class="text-xl font-bold text-slate-800 mb-4">Change Password</h2>

  @if (successMessage) {
    <div class="mb-4 p-3 bg-emerald-100 text-emerald-800 text-xs rounded-lg border border-emerald-200">
      {{ successMessage }}
    </div>
  }

  @if (errorMessage) {
    <div class="mb-4 p-3 bg-red-100 text-red-800 text-xs rounded-lg border border-red-200">
      {{ errorMessage }}
    </div>
  }

  <form [formGroup]="changeForm" (ngSubmit)="onChangePassword()" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">Current Password</label>
      <input
        type="password"
        formControlName="currentPassword"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"
      />
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">New Password</label>
      <input
        type="password"
        formControlName="newPassword"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"
      />
    </div>

    <button
      type="submit"
      [disabled]="changeForm.invalid || isLoading"
      class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-medium text-sm rounded-lg transition"
    >
      {{ isLoading ? 'Updating...' : 'Update Password' }}
    </button>
  </form>
</div>

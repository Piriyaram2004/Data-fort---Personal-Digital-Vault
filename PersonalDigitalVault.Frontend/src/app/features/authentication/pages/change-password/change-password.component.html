<div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl">

    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-white">
        Change Password
      </h1>

      <p class="text-slate-400 text-sm mt-1">
        Update your account password securely
      </p>
    </div>

    @if (successMessage) {
      <div class="p-4 bg-emerald-900/50 border border-emerald-700 text-emerald-200 text-sm rounded-xl text-center">
        {{ successMessage }}
      </div>

      <div class="mt-6 text-center">
<a
  routerLink="/vault"
  class="inline-block px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-xl transition cursor-pointer"
>
  Back to Main
</a>
      </div>
    } @else {

      @if (errorMessage) {
        <div class="mb-4 p-3 bg-red-900/50 border border-red-700 text-red-200 text-xs rounded-xl">
          {{ errorMessage }}
        </div>
      }

      <form
        [formGroup]="changeForm"
        (ngSubmit)="onChangePassword()"
        class="space-y-4"
      >

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">
            Current Password
          </label>

          <div class="relative">
            <input
              [type]="showCurrentPassword ? 'text' : 'password'"
              formControlName="currentPassword"
              class="w-full px-4 py-2.5 pr-12 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500 transition"
              placeholder="••••••••"
            />

            <button
              type="button"
              (click)="toggleCurrentPasswordVisibility()"
              class="absolute inset-y-0 right-0 flex items-center px-4 text-slate-400 hover:text-white"
            >
              @if (showCurrentPassword) {
                <span>🙈</span>
              } @else {
                <span>👁</span>
              }
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">
            New Password
          </label>

          <div class="relative">
            <input
              [type]="showNewPassword ? 'text' : 'password'"
              formControlName="newPassword"
              class="w-full px-4 py-2.5 pr-12 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500 transition"
              placeholder="••••••••"
            />

            <button
              type="button"
              (click)="toggleNewPasswordVisibility()"
              class="absolute inset-y-0 right-0 flex items-center px-4 text-slate-400 hover:text-white"
            >
              @if (showNewPassword) {
                <span>🙈</span>
              } @else {
                <span>👁</span>
              }
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">
            Confirm Password
          </label>

          <div class="relative">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              formControlName="confirmPassword"
              class="w-full px-4 py-2.5 pr-12 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500 transition"
              placeholder="••••••••"
            />

            <button
              type="button"
              (click)="toggleConfirmPasswordVisibility()"
              class="absolute inset-y-0 right-0 flex items-center px-4 text-slate-400 hover:text-white"
            >
              @if (showConfirmPassword) {
                <span>🙈</span>
              } @else {
                <span>👁</span>
              }
            </button>
          </div>

          @if (
            changeForm.get('confirmPassword')?.touched &&
            changeForm.hasError('passwordMismatch')
          ) {
            <p class="mt-1 text-xs text-red-400">
              Passwords do not match.
            </p>
          }
        </div>

        <button
          type="submit"
          [disabled]="changeForm.invalid || isLoading"
          class="w-full py-3 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-medium text-sm rounded-xl transition shadow-lg shadow-blue-600/30"
        >
          {{ isLoading ? 'Updating...' : 'Update Password' }}
        </button>

      </form>
    }

  </div>
</div>

<div class="min-h-screen bg-slate-950 flex items-center justify-center p-4">

  <div
    class="w-full max-w-md bg-slate-800 p-8 rounded-2xl
           border border-slate-700 shadow-2xl text-center">

    <div
      class="inline-flex items-center justify-center w-14 h-14
             bg-blue-600 rounded-xl font-bold text-2xl text-white mb-5">
      DF
    </div>

    <h1 class="text-2xl font-bold text-white mb-3">
      Email Verification
    </h1>

    @if (isLoading) {

      <p class="text-slate-300 text-sm">
        Verifying your email...
      </p>

    } @else if (isSuccess) {

      <div
        class="p-4 bg-green-900/40 border border-green-700 rounded-xl">

        <p class="text-green-300 text-sm font-medium">
          {{ message }}
        </p>

        <p class="text-slate-300 text-sm mt-2">
      You can now log in to your account.
    </p>

      </div>

    } @else {

      <div
        class="p-4 bg-red-900/40 border border-red-700 rounded-xl">

        <p class="text-red-300 text-sm">
          {{ message }}
        </p>

      </div>

    }

  </div>

</div>

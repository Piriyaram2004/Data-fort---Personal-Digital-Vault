<div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl text-center">
    <div class="inline-flex items-center justify-center w-14 h-14 bg-purple-900/50 text-purple-400 rounded-2xl mb-4 font-bold text-2xl">
      DF
    </div>
    <h1 class="text-xl font-bold text-white mb-1">Public File Download</h1>
    <p class="text-xs text-slate-400 mb-6">Data Fort Secured Link</p>

    @if (isLoading) {
      <app-loading message="Verifying share link..." />
    } @else if (errorMessage) {
      <div class="p-4 bg-red-900/40 border border-red-700 rounded-xl text-red-200 text-xs">
        {{ errorMessage }}
      </div>
    } @else if (fileDetails) {
      <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 text-left space-y-3 mb-6">
        <div>
          <span class="block text-[10px] uppercase font-semibold text-slate-500">File Name</span>
          <span class="text-sm font-semibold text-slate-200 truncate block">{{ fileDetails.documentName }}</span>
        </div>

        <div class="flex justify-between text-xs text-slate-400">
          <span>Size: {{ fileDetails.fileSizeBytes | fileSize }}</span>
          <span>Expires: {{ fileDetails.expiryDate | date:'shortDate' }}</span>
        </div>
      </div>

      <button
        (click)="onDownloadPublicFile()"
        [disabled]="isDownloading"
        class="w-full py-3 bg-purple-600 hover:bg-purple-700 disabled:opacity-50 text-white font-medium text-sm rounded-xl transition shadow-lg shadow-purple-600/30"
      >
        {{ isDownloading ? 'Preparing Download...' : 'Download File' }}
      </button>
    }
  </div>
</div>

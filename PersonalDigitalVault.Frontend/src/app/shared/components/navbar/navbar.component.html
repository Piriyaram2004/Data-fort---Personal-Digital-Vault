<header class="bg-slate-900 text-white shadow-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <div class="flex items-center space-x-3">
        <a routerLink="/vault" class="flex items-center space-x-2">
          <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-xl tracking-wider">DF</div>
          <span class="font-bold text-lg tracking-tight">Data Fort</span>
        </a>
        <span class="text-xs px-2 py-0.5 rounded bg-blue-900/60 text-blue-300 font-mono">Personal Vault</span>
      </div>

      <div class="flex items-center space-x-4">
        @if (userEmail) {
          <div class="text-xs text-right hidden sm:block">
            <p class="font-medium text-slate-200">{{ userEmail }}</p>
            <p class="text-slate-400 capitalize">{{ userRole || 'User' }}</p>
          </div>
        }

        <a routerLink="/auth/profile" class="p-2 text-slate-300 hover:text-white rounded-lg hover:bg-slate-800 transition" title="Profile">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </a>

        <button (click)="logout()" class="px-3 py-1.5 text-xs font-medium text-red-300 hover:text-white bg-red-900/30 hover:bg-red-600 rounded-lg transition">
          Logout
        </button>
      </div>
    </div>
  </div>
</header>

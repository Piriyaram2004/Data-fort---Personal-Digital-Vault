<header class="bg-slate-900 text-white shadow-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <div class="flex items-center justify-between h-16">

      <!-- Data Fort Logo -->
      <div class="flex items-center space-x-3">

        <a routerLink="/vault" class="flex items-center space-x-2">

          <div
            class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-xl tracking-wider"
          >
            DF
          </div>

          <span class="font-bold text-lg tracking-tight">
            Data Fort
          </span>

        </a>

        <span
          class="text-xs px-2 py-0.5 rounded bg-blue-900/60 text-blue-300 font-mono"
        >
          Personal Vault
        </span>

      </div>

      <!-- User Section -->
      <div class="flex items-center space-x-4">

        @if (userName) {

          <div class="text-xs text-right hidden sm:block">

            <p class="font-medium text-slate-200">
              {{ displayUserName }}
            </p>

            <p class="text-slate-400 capitalize">
              {{ userRole || 'User' }}
            </p>

          </div>
        }

        <!-- Profile Avatar -->
        <a
          routerLink="/auth/profile"
          class="w-9 h-9 flex items-center justify-center bg-blue-600 text-white font-bold text-sm rounded-full hover:bg-blue-700 transition"
          title="Profile"
        >
          {{ userInitials }}
        </a>

        <!-- Logout -->
        <button
          (click)="logout()"
          class="px-3 py-1.5 text-xs font-medium text-red-300 hover:text-white bg-red-900/30 hover:bg-red-600 rounded-lg transition"
        >
          Logout
        </button>

      </div>

    </div>

  </div>
</header>

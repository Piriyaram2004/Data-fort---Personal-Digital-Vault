<aside
  class="w-64 bg-slate-800 text-slate-200 min-h-[calc(100vh-4rem)] p-4 flex flex-col justify-between"
>
  <div class="space-y-6">

    <!-- NORMAL USER NAVIGATION -->
    @if (!isAdmin) {

      <!-- DIGITAL VAULT -->
      <div>
        <h2
          class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-3 mb-2"
        >
          Digital Vault
        </h2>

        <nav class="space-y-1">

          <!-- Vault Home -->
          <a
            routerLink="/vault"
            routerLinkActive="bg-blue-600 text-white"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-slate-700 transition"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>

            <span>Vault Home</span>
          </a>

          <!-- Folders -->
          <a
            routerLink="/vault/folders"
            routerLinkActive="bg-blue-600 text-white"
            class="flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-slate-700 transition"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"
              />
            </svg>

            <span>Folders</span>
          </a>

          <!-- Documents -->
          <a
            routerLink="/vault/documents"
            routerLinkActive="bg-blue-600 text-white"
            class="flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-slate-700 transition"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"
              />
            </svg>

            <span>Documents</span>
          </a>

          <!-- Credentials -->
          <a
            routerLink="/vault/credentials"
            routerLinkActive="bg-blue-600 text-white"
            class="flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-slate-700 transition"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 0121 9z"
              />
            </svg>

            <span>Credentials</span>
          </a>

          <!-- Search Vault -->
          <a
            routerLink="/vault/search"
            routerLinkActive="bg-blue-600 text-white"
            class="flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-slate-700 transition"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>

            <span>Search Vault</span>
          </a>

        </nav>
      </div>

      <!-- PUBLIC SHARING -->
      <div>
        <h2
          class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-3 mb-2"
        >
          Public Sharing
        </h2>

        <nav class="space-y-1">

          <a
            routerLink="/sharing/manage"
            routerLinkActive="bg-blue-600 text-white"
            class="flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-slate-700 transition"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"
              />
            </svg>

            <span>Share Links</span>
          </a>

        </nav>
      </div>
    }

    <!-- ADMINISTRATOR NAVIGATION -->
    @if (isAdmin) {

      <div>
        <h2
          class="text-xs font-semibold text-amber-400 uppercase tracking-wider px-3 mb-2"
        >
          Administration
        </h2>

        <nav class="space-y-1">

          <!-- Dashboard -->
          <a
            routerLink="/admin/dashboard"
            routerLinkActive="bg-amber-600 text-white"
            class="flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-slate-700 transition"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2 2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
              />
            </svg>

            <span>Dashboard</span>
          </a>

          <!-- User Management -->
          <a
            routerLink="/admin/users"
            routerLinkActive="bg-amber-600 text-white"
            class="flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-slate-700 transition"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
              />
            </svg>

            <span>User Management</span>
          </a>

          <!-- Audit Logs -->
          <a
            routerLink="/admin/audit-logs"
            routerLinkActive="bg-amber-600 text-white"
            class="flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-slate-700 transition"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
              />
            </svg>

            <span>Audit Logs</span>
          </a>

        </nav>
      </div>
    }

  </div>

  <!-- FOOTER -->
  <div
    class="border-t border-slate-700 pt-4 text-xs text-slate-400 text-center"
  >
    Data Fort v1.0.0
  </div>
</aside>
